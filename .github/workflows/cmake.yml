---
jobs:
  build-msys:
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ${{ matrix.sys.runner }}
    steps:
      - id: fixed_workspace
        name: Fix path
        run: >-
          echo out=$("${{github.workspace}}" -Replace "\\","/") | Out-File
          -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - if: matrix.sys.name == 'clangarm64'
        name: Install NSIS via Chocolatey
        run: |
          choco install nsis -y --no-progress
          'C:\Program Files (x86)\NSIS' | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_PATH
      - uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884
        with:
          install: >-
            make
          msystem: ${{matrix.sys.name}}
          pacboy: >-
            cmake:p
            ninja:p
            ${{ matrix.sys.name == 'clangarm64' && ' ' || 'nsis:p' }}
            toolchain:p
          update: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          WORKSPACE: '${{steps.fixed_workspace.outputs.out}}'
        name: Configure
        run: >-
          cmake -G Ninja -B "$WORKSPACE/build"
          --install-prefix "$WORKSPACE/build/prefix"
          -DCMAKE_BUILD_TYPE=${{matrix.build-type}}
          -DCPACK_SYSTEM_NAME=${{matrix.sys.cpack_system}}
        shell: msys2 {0}
      - env:
          WORKSPACE: '${{steps.fixed_workspace.outputs.out}}'
        name: Build
        run: cmake --build "$WORKSPACE/build" --verbose
        shell: msys2 {0}
      - env:
          WORKSPACE: '${{steps.fixed_workspace.outputs.out}}'
        name: Install
        run: >-
          cmake --install "$WORKSPACE/build"
          --config ${{matrix.build-type}} --verbose
        shell: msys2 {0}
      - env:
          WORKSPACE: '${{steps.fixed_workspace.outputs.out}}'
        name: Package
        run: >-
          cpack -C ${{matrix.build-type}}
          --config "$WORKSPACE/build/CPackConfig.cmake" --verbose
        shell: msys2 {0}
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: error
          name: winpbcopy-${{ matrix.build-type }}-${{ matrix.sys.name }}
          path: |
            ${{github.workspace}}/winpbcopy-*.exe
            ${{github.workspace}}/winpbcopy-*.zip
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            ${{github.workspace}}/winpbcopy-*.exe
            ${{github.workspace}}/winpbcopy-*.zip
      - env:
          GH_TOKEN: ${{ github.token }}
          WORKSPACE: '${{steps.fixed_workspace.outputs.out}}'
        if: ${{ github.ref_type == 'tag' }}
        name: Upload package
        run: |
          shopt -s nullglob
          files=("$WORKSPACE"/winpbcopy-*.exe "$WORKSPACE"/winpbcopy-*.zip)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No package files matched winpbcopy-*.{exe,zip}."
            exit 1
          fi
          # Every matrix job targets the same draft release, so losing the creation race is
          # expected; only a release that is still absent afterwards is an error.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes '' \
              || gh release view "$GITHUB_REF_NAME" >/dev/null
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
        sys:
          - cpack_system: ucrt64
            env: ucrt-x86_64
            name: ucrt64
            runner: windows-latest
          - cpack_system: clangarm64
            env: clang-aarch64
            name: clangarm64
            runner: windows-11-arm
  build-cross:
    permissions:
      attestations: write
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Set up MinGW
        uses: egor-tensin/setup-mingw@41b837e47d7f85214629d255b9c4bc3fcbe9fd63
        with:
          platform: x64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Configure
        run: >-
          cmake -B ${{github.workspace}}/build
          -DCMAKE_BUILD_TYPE=${{matrix.build-type}}
          -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON
          -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc
          -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++
          -DCMAKE_SYSTEM_NAME=Windows
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
          -DCPACK_SYSTEM_NAME=mingw-cross-x86_64
      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{matrix.build-type}} --verbose
      - name: Package
        run: >-
          cpack -G ZIP -C ${{matrix.build-type}}
          --config ${{github.workspace}}/build/CPackConfig.cmake
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: error
          name: 'winpbcopy-cross-${{matrix.build-type}}'
          path: |
            ${{github.workspace}}/winpbcopy-*.zip
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            ${{github.workspace}}/winpbcopy-*.zip
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
name: Build
'on':
  push:
    branches: [master]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [master]
permissions:
  contents: read
