---
concurrency:
  cancel-in-progress: false
  group: '${{ github.workflow }}-${{ github.ref }}'
  queue: 'max'
jobs:
  build-msys:
    name: 'Build (MSYS2)'
    permissions:
      attestations: write
      contents: write
      id-token: write
    runs-on: ${{ matrix.sys.runner }}
    steps:
      - id: fixed_workspace
        name: Fix path
        run: >-
          echo out=$("$env:GITHUB_WORKSPACE" -Replace "\\","/") | Out-File
          -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - if: matrix.sys.name == 'clangarm64'
        name: Install NSIS via Chocolatey
        run: |
          choco install nsis -y --no-progress
          'C:\Program Files (x86)\NSIS' | Out-File -Append -Encoding utf8 -FilePath $env:GITHUB_PATH
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          install: >-
            make
          msystem: ${{matrix.sys.name}}
          pacboy: >-
            cmake:p
            ninja:p
            ${{ matrix.sys.name == 'clangarm64' && ' ' || 'nsis:p' }}
            toolchain:p
          update: true
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
          CPACK_SYSTEM: '${{ matrix.sys.cpack_system }}'
          WORKSPACE: '${{steps.fixed_workspace.outputs.out}}'
        name: Configure
        run: >-
          cmake -G Ninja -B "$WORKSPACE/build"
          --install-prefix "$WORKSPACE/build/prefix"
          -DCMAKE_BUILD_TYPE="${BUILD_TYPE}"
          -DCPACK_SYSTEM_NAME="${CPACK_SYSTEM}"
        shell: msys2 {0}
      - env:
          WORKSPACE: '${{steps.fixed_workspace.outputs.out}}'
        name: Build
        run: cmake --build "$WORKSPACE/build" --verbose
        shell: msys2 {0}
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
          WORKSPACE: '${{steps.fixed_workspace.outputs.out}}'
        name: Install
        run: >-
          cmake --install "$WORKSPACE/build"
          --config "${BUILD_TYPE}" --verbose
        shell: msys2 {0}
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
          WORKSPACE: '${{steps.fixed_workspace.outputs.out}}'
        name: Package
        run: >-
          cpack -C "${BUILD_TYPE}"
          --config "$WORKSPACE/build/CPackConfig.cmake" --verbose
        shell: msys2 {0}
      # Release binaries link the release CRT. The scan below reports markers such as
      # VCRUNTIME140D or ucrtbased and fails the job when an installed EXE or DLL references a
      # debug runtime.
      - if: matrix.build-type == 'Release'
        name: Check for debug runtime linkage
        run: |
          $markers = @(
            'VCRUNTIME140D',
            'MSVCP140D',
            'VCOMP140D',
            'CONCRT140D',
            'VCCORLIB140D',
            'ucrtbased',
            'MSVCRTD',
            'MSVCPRTD'
          )
          $failed = $false
          $binaries = Get-ChildItem -Path "$env:GITHUB_WORKSPACE/build/prefix" -Recurse -File `
            -Include *.dll, *.exe
          if (-not $binaries) {
            Write-Host '::error::No installed binaries were found to scan.'
            exit 1
          }
          $binaries | ForEach-Object {
            $bytes = [System.IO.File]::ReadAllBytes($_.FullName)
            $text = [System.Text.Encoding]::ASCII.GetString($bytes)
            foreach ($marker in $markers) {
              if ($text.Contains($marker)) {
                Write-Host "::error::$($_.Name) references debug runtime $marker."
                $failed = $true
              }
            }
          }
          if ($failed) {
            exit 1
          }
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: error
          name: winpbcopy-${{ matrix.build-type }}-${{ matrix.sys.name }}
          path: |
            ${{github.workspace}}/winpbcopy-*.exe
            ${{github.workspace}}/winpbcopy-*.zip
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            ${{github.workspace}}/winpbcopy-*.exe
            ${{github.workspace}}/winpbcopy-*.zip
      - env:
          GH_TOKEN: ${{ github.token }}
          WORKSPACE: '${{steps.fixed_workspace.outputs.out}}'
        if: ${{ github.ref_type == 'tag' && matrix.build-type == 'Release' }}
        name: Upload package
        run: |
          shopt -s nullglob
          files=("$WORKSPACE"/winpbcopy-*.exe "$WORKSPACE"/winpbcopy-*.zip)
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error::No package files matched winpbcopy-*.{exe,zip}."
            exit 1
          fi
          # Every matrix job targets the same draft release, so losing the creation race is
          # expected; only a release that is still absent afterwards is an error.
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --draft --title "$GITHUB_REF_NAME" --notes '' \
              || gh release view "$GITHUB_REF_NAME" >/dev/null
          fi
          gh release upload "$GITHUB_REF_NAME" "${files[@]}" --clobber
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
        sys:
          - cpack_system: ucrt64
            env: ucrt-x86_64
            name: ucrt64
            runner: windows-latest
          - cpack_system: clangarm64
            env: clang-aarch64
            name: clangarm64
            runner: windows-11-arm
  build-cross:
    name: 'Build (cross)'
    permissions:
      attestations: write
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - name: Set up MinGW
        uses: egor-tensin/setup-mingw@41b837e47d7f85214629d255b9c4bc3fcbe9fd63
        with:
          platform: x64
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        name: Configure
        run: >-
          cmake -B "${GITHUB_WORKSPACE}/build"
          -DCMAKE_BUILD_TYPE="${BUILD_TYPE}"
          -DCMAKE_BUILD_WITH_INSTALL_RPATH=ON
          -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc
          -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++
          -DCMAKE_SYSTEM_NAME=Windows
          -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON
          -DCPACK_SYSTEM_NAME=mingw-cross-x86_64
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        name: Build
        run: cmake --build "${GITHUB_WORKSPACE}/build" --config "${BUILD_TYPE}" --verbose
      - env:
          BUILD_TYPE: '${{ matrix.build-type }}'
        name: Package
        run: >-
          cpack -G ZIP -C "${BUILD_TYPE}"
          --config "${GITHUB_WORKSPACE}/build/CPackConfig.cmake"
      - name: 'Upload Artifacts'
        uses: 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a'
        with:
          if-no-files-found: error
          name: 'winpbcopy-cross-${{matrix.build-type}}'
          path: |
            ${{github.workspace}}/winpbcopy-*.zip
      - name: Attest
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8
        with:
          subject-path: |
            ${{github.workspace}}/winpbcopy-*.zip
    strategy:
      fail-fast: false
      matrix:
        build-type: [Debug, Release]
name: Build
'on':
  push:
    branches: [master]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [master]
permissions: {}
